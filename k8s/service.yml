apiVersion: v1
kind: Service
metadata:
  name: shopnow-frontend-service
  namespace: web-app
spec:
  type: LoadBalancer
  selector:
    app: shopnow-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-backend-service
  namespace: web-app
spec:
  type: ClusterIP
  selector:
    app: shopnow-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-admin-service
  namespace: web-app
spec:
  type: ClusterIP
  selector:
    app: shopnow-admin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
