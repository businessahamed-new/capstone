apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnow-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnow-admin
  template:
    metadata:
      labels:
        app: shopnow-admin
    spec:
      containers:
        - name: shopnow-admin
          image: 766851565676.dkr.ecr.us-east-1.amazonaws.com/shopnow-admin:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: shopnow-admin-service
spec:
  selector:
    app: shopnow-admin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
